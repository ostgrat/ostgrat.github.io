# Sveltia CMS – legt fest, was der Kunde bearbeiten darf.
backend:
  name: github
  repo: ostgrat/ostgrat.github.io
  branch: main

site_url: https://ostgrat.github.io
display_url: https://ostgrat.github.io

# Sprachen: Deutsch (Standard, Dateien ohne Endung) und Englisch (Dateien mit .en, Website unter /en/)
i18n:
  structure: multiple_files
  locales: [de, en]
  default_locale: de
  omit_default_locale_from_file_path: true

media_folder: public/uploads
public_folder: /uploads

collections:
  # ---------- Blog: eine Sammlung pro Beitragsart ----------
  - name: artikel
    i18n: true
    label: "Blog: Artikel"
    label_singular: Artikel
    description: Normale Beiträge mit Text und Bild.
    icon: article
    folder: src/content/blog/artikel
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    sortable_fields: [date, title]
    fields:
      - &title { label: Titel, name: title, widget: string, i18n: true }
      - &urlslug { label: "Adresse (nur auf Englisch ausfüllen)", name: urlSlug, widget: string, required: false, i18n: true, hint: "Englische Adresse, z. B. downtime-is-not-a-patch-plan. Leer = deutscher Dateiname." }
      - &date { label: Datum, name: date, widget: datetime, time_format: false, format: "YYYY-MM-DD", i18n: duplicate }
      - &author { label: Autor:in, name: author, widget: string, i18n: duplicate }
      - &category
        label: Thema
        name: category
        i18n: duplicate
        widget: select
        hint: Bestimmt den Filter auf der Startseite.
        options:
          - { label: SOC, value: soc }
          - { label: Red Team, value: redteam }
          - { label: OT, value: ot }
          - { label: Compliance, value: compliance }
      - &excerpt { label: Kurztext für die Vorschau, name: excerpt, widget: text, i18n: true }
      - &cover { label: Titelbild, name: cover, widget: image, required: false, i18n: duplicate }
      - &body { label: Text, name: body, widget: markdown, required: false, i18n: true }
      - &draft { label: "Entwurf (wird nicht veröffentlicht)", name: draft, widget: boolean, default: false, required: false, i18n: duplicate }

  - name: warnungen
    i18n: true
    label: "Blog: Sicherheitswarnungen"
    label_singular: Sicherheitswarnung
    description: Akute Warnungen – werden orange markiert und mit Handlungsschritten angezeigt.
    icon: warning
    folder: src/content/blog/warnungen
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    sortable_fields: [date, title]
    fields:
      - *title
      - *urlslug
      - *date
      - *author
      - { label: "Kennung (z. B. CVE-Nummer)", name: cve, widget: string, required: false, i18n: duplicate }
      - label: Schweregrad
        name: severity
        i18n: duplicate
        widget: select
        options: [{ label: Kritisch, value: kritisch }, { label: Hoch, value: hoch }, { label: Mittel, value: mittel }]
      - { label: Betroffene Systeme, name: affected, widget: list, required: false, label_singular: System, i18n: true }
      - { label: Was jetzt tun (Schritte), name: actions, widget: list, required: false, label_singular: Schritt, i18n: true }
      - *excerpt
      - *cover
      - *body
      - *draft

  - name: fallstudien
    i18n: true
    label: "Blog: Fallstudien"
    label_singular: Fallstudie
    description: Kundenprojekte mit Ausgangslage, Vorgehen und Ergebnis in Zahlen.
    icon: work
    folder: src/content/blog/fallstudien
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    sortable_fields: [date, title]
    fields:
      - *title
      - *urlslug
      - *date
      - *author
      - *category
      - { label: Branche, name: industry, widget: string, required: false, i18n: true }
      - { label: Unternehmensgröße, name: companySize, widget: string, required: false, i18n: true }
      - { label: Umfang / Dauer, name: duration, widget: string, required: false, i18n: true }
      - label: Ergebnisse in Zahlen
        name: results
        i18n: duplicate
        widget: list
        required: false
        label_singular: Kennzahl
        summary: "{{fields.value}} – {{fields.label}}"
        fields:
          - { label: Zahl, name: value, widget: string, hint: "z. B. 4 h oder 98 %", i18n: true }
          - { label: Beschreibung, name: label, widget: string, i18n: true }
      - { label: Ausgangslage, name: challenge, widget: text, required: false, i18n: true }
      - { label: Vorgehen, name: approach, widget: text, required: false, i18n: true }
      - { label: Ergebnis, name: outcome, widget: text, required: false, i18n: true }
      - *excerpt
      - *cover
      - *body
      - *draft

  # ---------- Startseite: Blöcke (Markup in src/lib/home-blocks.mjs) ----------
