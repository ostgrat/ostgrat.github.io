# Sveltia CMS – legt fest, was der Kunde bearbeiten darf.
backend:
  name: github
  repo: ostgrat/ostgrat.github.io
  branch: main

site_url: https://ostgrat.github.io
display_url: https://ostgrat.github.io

media_folder: public/uploads
public_folder: /uploads

collections:
  # ---------- Blog: eine Sammlung pro Beitragsart ----------
  - name: artikel
    label: "Blog: Artikel"
    label_singular: Artikel
    description: Normale Beiträge mit Text und Bild.
    icon: article
    folder: src/content/blog/artikel
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    sortable_fields: [date, title]
    fields:
      - &title { label: Titel, name: title, widget: string }
      - &date { label: Datum, name: date, widget: datetime, time_format: false, format: "YYYY-MM-DD" }
      - &author { label: Autor:in, name: author, widget: string }
      - &category
        label: Thema
        name: category
        widget: select
        hint: Bestimmt den Filter auf der Startseite.
        options:
          - { label: SOC, value: soc }
          - { label: Red Team, value: redteam }
          - { label: OT, value: ot }
          - { label: Compliance, value: compliance }
      - &excerpt { label: Kurztext für die Vorschau, name: excerpt, widget: text }
      - &cover { label: Titelbild, name: cover, widget: image, required: false }
      - &body { label: Text, name: body, widget: markdown, required: false }
      - &draft { label: "Entwurf (wird nicht veröffentlicht)", name: draft, widget: boolean, default: false, required: false }

  - name: warnungen
    label: "Blog: Sicherheitswarnungen"
    label_singular: Sicherheitswarnung
    description: Akute Warnungen – werden orange markiert und mit Handlungsschritten angezeigt.
    icon: warning
    folder: src/content/blog/warnungen
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    sortable_fields: [date, title]
    fields:
      - *title
      - *date
      - *author
      - { label: "Kennung (z. B. CVE-Nummer)", name: cve, widget: string, required: false }
      - label: Schweregrad
        name: severity
        widget: select
        options: [{ label: Kritisch, value: kritisch }, { label: Hoch, value: hoch }, { label: Mittel, value: mittel }]
      - { label: Betroffene Systeme, name: affected, widget: list, required: false, label_singular: System }
      - { label: Was jetzt tun (Schritte), name: actions, widget: list, required: false, label_singular: Schritt }
      - *excerpt
      - *cover
      - *body
      - *draft

  - name: fallstudien
    label: "Blog: Fallstudien"
    label_singular: Fallstudie
    description: Kundenprojekte mit Ausgangslage, Vorgehen und Ergebnis in Zahlen.
    icon: work
    folder: src/content/blog/fallstudien
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    sortable_fields: [date, title]
    fields:
      - *title
      - *date
      - *author
      - *category
      - { label: Branche, name: industry, widget: string, required: false }
      - { label: Unternehmensgröße, name: companySize, widget: string, required: false }
      - { label: Umfang / Dauer, name: duration, widget: string, required: false }
      - label: Ergebnisse in Zahlen
        name: results
        widget: list
        required: false
        label_singular: Kennzahl
        summary: "{{fields.value}} – {{fields.label}}"
        fields:
          - { label: Zahl, name: value, widget: string, hint: "z. B. 4 h oder 98 %" }
          - { label: Beschreibung, name: label, widget: string }
      - { label: Ausgangslage, name: challenge, widget: text, required: false }
      - { label: Vorgehen, name: approach, widget: text, required: false }
      - { label: Ergebnis, name: outcome, widget: text, required: false }
      - *excerpt
      - *cover
      - *body
      - *draft

  # ---------- Seitenbaukasten ----------
  - name: seiten
    label: Seiten
    label_singular: Seite
    description: Eigene Seiten aus Blöcken zusammenstellen. Die Adresse entsteht aus dem Titel. Alle Blöcke mit Beispiel unter /bloecke/
    icon: web
    folder: src/content/pages
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: Titel, name: title, widget: string, hint: "Wird auch zur Adresse, z. B. „NIS2-Check“ → /nis2-check/" }
      - { label: Beschreibung für Google, name: description, widget: text, required: false }
      - *draft
      - label: Blöcke
        name: blocks
        widget: list
        label_singular: Block
        thumbnail: vorschau
        hint: "Mit „Add Block“ einen Block wählen, mit den Pfeilen sortieren. Alle Blöcke mit Beispiel: [Blockübersicht öffnen](/bloecke/)"
        types:
          - label: Hero
            name: hero
            widget: object
            description: "Seitenanfang: große Überschrift, hervorgehobene Zeile, Einleitung, Button, optional Bild rechts."
            summary: "{{fields.headline}}"
            fields:
              - { label: "So sieht der Block aus", name: vorschau, widget: image, default: /uploads/bloecke/hero.jpg, readonly: true, required: false, choose_url: false }
              - { label: Dachzeile, name: kicker, widget: string, required: false }
              - { label: Headline, name: headline, widget: string }
              - { label: Hervorgehobene Zeile, name: highlight, widget: string, required: false }
              - { label: Einleitung, name: lead, widget: text, required: false }
              - { label: Button-Text, name: ctaLabel, widget: string, required: false }
              - { label: Button-Link, name: ctaLink, widget: string, required: false }
              - { label: Bild (optional), name: image, widget: image, required: false }
          - label: Text
            name: text
            widget: object
            description: "Überschrift links, längerer Text rechts. Für Erklärungen, Listen, Absätze."
            summary: "{{fields.heading}}"
            fields:
              - { label: "So sieht der Block aus", name: vorschau, widget: image, default: /uploads/bloecke/text.jpg, readonly: true, required: false, choose_url: false }
              - { label: Dachzeile, name: kicker, widget: string, required: false }
              - { label: Überschrift, name: heading, widget: string, required: false }
              - { label: Text, name: body, widget: markdown }
          - label: Bild mit Text
            name: imageText
            widget: object
            description: "Großes Bild neben Überschrift, Text und optionalem Button. Bild links oder rechts."
            summary: "{{fields.heading}}"
            fields:
              - { label: "So sieht der Block aus", name: vorschau, widget: image, default: /uploads/bloecke/imageText.jpg, readonly: true, required: false, choose_url: false }
              - { label: Bild, name: image, widget: image }
              - { label: Bild-Position, name: imagePosition, widget: select, options: [links, rechts], default: links }
              - { label: Dachzeile, name: kicker, widget: string, required: false }
              - { label: Überschrift, name: heading, widget: string, required: false }
              - { label: Text, name: body, widget: markdown, required: false }
              - { label: Button-Text, name: ctaLabel, widget: string, required: false }
              - { label: Button-Link, name: ctaLink, widget: string, required: false }
          - label: Kennzahlen
            name: stats
            widget: object
            description: "Große Zahlen in einer Reihe, jeweils mit kurzer Beschreibung darunter."
            summary: "{{fields.heading}}"
            fields:
              - { label: "So sieht der Block aus", name: vorschau, widget: image, default: /uploads/bloecke/stats.jpg, readonly: true, required: false, choose_url: false }
              - { label: Dachzeile, name: kicker, widget: string, required: false }
              - { label: Überschrift, name: heading, widget: string, required: false }
              - label: Kennzahlen
                name: items
                widget: list
                label_singular: Kennzahl
                summary: "{{fields.value}} – {{fields.label}}"
                fields:
                  - { label: Zahl, name: value, widget: string }
                  - { label: Beschreibung, name: label, widget: string }
          - label: FAQ
            name: faq
            widget: object
            description: "Überschrift links, aufklappbare Fragen und Antworten rechts."
            summary: "{{fields.heading}}"
            fields:
              - { label: "So sieht der Block aus", name: vorschau, widget: image, default: /uploads/bloecke/faq.jpg, readonly: true, required: false, choose_url: false }
              - { label: Dachzeile, name: kicker, widget: string, required: false }
              - { label: Überschrift, name: heading, widget: string, required: false }
              - label: Fragen
                name: items
                widget: list
                label_singular: Frage
                summary: "{{fields.question}}"
                fields:
                  - { label: Frage, name: question, widget: string }
                  - { label: Antwort, name: answer, widget: text }
          - label: Call-to-Action
            name: cta
            widget: object
            description: "Umrandeter Kasten mit Überschrift, kurzem Text und Button – meist am Seitenende."
            summary: "{{fields.heading}}"
            fields:
              - { label: "So sieht der Block aus", name: vorschau, widget: image, default: /uploads/bloecke/cta.jpg, readonly: true, required: false, choose_url: false }
              - { label: Überschrift, name: heading, widget: string }
              - { label: Text, name: text, widget: text, required: false }
              - { label: Button-Text, name: buttonLabel, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }
          - label: Blog-Teaser
            name: blogTeaser
            widget: object
            description: "Die neuesten Blogbeiträge als Karten, optional nach Thema gefiltert."
            summary: "{{fields.heading}}"
            fields:
              - { label: "So sieht der Block aus", name: vorschau, widget: image, default: /uploads/bloecke/blogTeaser.jpg, readonly: true, required: false, choose_url: false }
              - { label: Dachzeile, name: kicker, widget: string, required: false }
              - { label: Überschrift, name: heading, widget: string, required: false }
              - label: Thema
                name: category
                widget: select
                default: alle
                options:
                  - { label: Alle, value: alle }
                  - { label: Warnungen, value: warnung }
                  - { label: SOC, value: soc }
                  - { label: Red Team, value: redteam }
                  - { label: OT, value: ot }
                  - { label: Compliance, value: compliance }
              - { label: Anzahl Beiträge, name: count, widget: number, value_type: int, min: 1, max: 6, default: 3 }

  # ---------- Startseite: Blöcke (Markup in src/lib/home-blocks.mjs) ----------
  - name: startseite
    label: Startseite
    icon: home
    files:
    - name: home
      label: Startseite
      file: src/data/home.json
      format: json
      fields:
      - label: Blöcke
        name: blocks
        widget: list
        label_singular: Block
        thumbnail: ansicht
        hint: Blöcke wählen, sortieren und befüllen. Hell/Dunkel pro Block bestimmt den Farbwechsel beim Scrollen.
        types:
        - label: Hero mit Monitor & Laufband
          name: hero
          widget: object
          description: 'Seitenanfang: Headline in drei Zeilen (dritte wird getippt), Einleitung, Button, Laufband.'
          summary: '{{fields.line1}} {{fields.line2}}'
          fields:
          - label: So sieht der Block aus
            name: ansicht
            widget: image
            default: /uploads/bloecke/start-hero.jpg
            readonly: true
            required: false
            choose_url: false
          - label: Hintergrund
            name: theme
            widget: select
            default: dunkel
            options:
            - label: Dunkel
              value: dunkel
            - label: Hell
              value: hell
            hint: Beim Scrollen blendet die Seite in diese Farbe über.
          - label: Subline (unter der Headline)
            name: kicker
            widget: string
          - label: Headline – Zeile 1
            name: line1
            widget: string
          - label: Headline – Zeile 2
            name: line2
            widget: string
          - label: Headline – Zeile 3 (getippt, hervorgehoben)
            name: highlight
            widget: string
          - label: Einleitung
            name: lead
            widget: text
          - label: Button-Text
            name: ctaLabel
            widget: string
            required: false
          - label: Button-Link
            name: ctaLink
            widget: string
            required: false
            hint: 'z. B. #kontakt oder /nis2-check/'
          - label: Laufband
            name: ticker
            widget: list
            label_singular: Eintrag
            hint: 'Links: `[Text](#ziel)` · Fett: `**Text**`'
        - label: Fakten & Zertifikate
          name: fakten
          widget: object
          description: Headline, Text, Kennzahlen rechts, Zertifikats-Logos und -Kacheln, animiertes Diagramm.
          summary: '{{fields.heading}}'
          fields:
          - label: So sieht der Block aus
            name: ansicht
            widget: image
            default: /uploads/bloecke/start-fakten.jpg
            readonly: true
            required: false
            choose_url: false
          - label: Hintergrund
            name: theme
            widget: select
            default: hell
            options:
            - label: Dunkel
              value: dunkel
            - label: Hell
              value: hell
            hint: Beim Scrollen blendet die Seite in diese Farbe über.
          - label: Überschrift (Zeilenumbruch = neue Zeile)
            name: heading
            widget: text
          - label: Unterzeile
            name: sub
            widget: string
          - label: Text
            name: text
            widget: text
            hint: 'Links: `[Text](#ziel)` · Fett: `**Text**`'
          - label: Button-Text
            name: ctaLabel
            widget: string
            required: false
          - label: Button-Link
            name: ctaLink
            widget: string
            required: false
            hint: 'z. B. #kontakt oder /nis2-check/'
          - label: Textlink
            name: linkLabel
            widget: string
            required: false
          - label: Textlink-Ziel
            name: linkHref
            widget: string
            required: false
          - label: Logos
            name: logos
            widget: list
            label_singular: Logo
            summary: '{{fields.alt}}'
            fields:
            - label: Logo
              name: image
              widget: image
            - label: Beschreibung (Alt-Text)
              name: alt
              widget: string
            - label: Höhe in Pixel
              name: height
              widget: number
              value_type: int
              default: 32
              min: 12
              max: 80
          - label: Kennzahlen
            name: stats
            widget: list
            label_singular: Kennzahl
            summary: '{{fields.value}} – {{fields.label}}'
            fields:
            - label: Zahl
              name: value
              widget: string
            - label: Beschreibung
              name: label
              widget: string
          - label: Zertifikats-Kacheln
            name: certs
            widget: list
            label_singular: Kachel
            summary: '{{fields.title}}'
            fields:
            - label: Titel
              name: title
              widget: string
            - label: Untertitel
              name: subtitle
              widget: string
        - label: Team mit Gruppenfoto
          name: team
          widget: object
          description: Headline und Text, darunter großes Teamfoto mit Effekten.
          summary: '{{fields.heading}}'
          fields:
          - label: So sieht der Block aus
            name: ansicht
            widget: image
            default: /uploads/bloecke/start-team.jpg
            readonly: true
            required: false
            choose_url: false
          - label: Hintergrund
            name: theme
            widget: select
            default: hell
            options:
            - label: Dunkel
              value: dunkel
            - label: Hell
              value: hell
            hint: Beim Scrollen blendet die Seite in diese Farbe über.
          - label: Überschrift
            name: heading
            widget: string
          - label: Text
            name: lead
            widget: text
          - label: Zusatz (hervorgehoben)
            name: hint
            widget: string
            required: false
          - label: Button-Text
            name: ctaLabel
            widget: string
            required: false
          - label: Button-Link
            name: ctaLink
            widget: string
            required: false
            hint: 'z. B. #kontakt oder /nis2-check/'
          - label: Gruppenfoto
            name: image
            widget: image
          - label: Bildbeschreibung (Alt-Text)
            name: imageAlt
            widget: string
        - label: Bild, Text & Schritte
          name: nis2
          widget: object
          description: Bild links, rechts Headline, Text, nummerierte Schritte und Button.
          summary: '{{fields.heading}}'
          fields:
          - label: So sieht der Block aus
            name: ansicht
            widget: image
            default: /uploads/bloecke/start-nis2.jpg
            readonly: true
            required: false
            choose_url: false
          - label: Hintergrund
            name: theme
            widget: select
            default: hell
            options:
            - label: Dunkel
              value: dunkel
            - label: Hell
              value: hell
            hint: Beim Scrollen blendet die Seite in diese Farbe über.
          - label: Überschrift
            name: heading
            widget: string
          - label: Text
            name: text
            widget: text
            hint: 'Links: `[Text](#ziel)` · Fett: `**Text**`'
          - label: Schritte
            name: steps
            widget: list
            label_singular: Schritt
            summary: '{{fields.title}}'
            fields:
            - label: Titel
              name: title
              widget: string
            - label: Text
              name: text
              widget: string
          - label: Bild
            name: image
            widget: image
          - label: Bildbeschreibung (Alt-Text)
            name: imageAlt
            widget: string
          - label: Button-Text
            name: ctaLabel
            widget: string
            required: false
          - label: Button-Link
            name: ctaLink
            widget: string
            required: false
            hint: 'z. B. #kontakt oder /nis2-check/'
        - label: Progress Section
          name: redteam
          widget: object
          description: Box bleibt beim Scrollen stehen, der Fortschritt läuft durch die Schritte, das Bild wechselt.
          summary: '{{fields.heading}}'
          fields:
          - label: So sieht der Block aus
            name: ansicht
            widget: image
            default: /uploads/bloecke/start-redteam.jpg
            readonly: true
            required: false
            choose_url: false
          - label: Hintergrund
            name: theme
            widget: select
            default: hell
            options:
            - label: Dunkel
              value: dunkel
            - label: Hell
              value: hell
            hint: Beim Scrollen blendet die Seite in diese Farbe über. Dieser Block ist immer hell gestaltet – „Hell“ lassen.
          - label: Überschrift
            name: heading
            widget: string
          - label: Überschrift – farbiger Teil
            name: headingAccent
            widget: string
            required: false
          - label: Text
            name: text
            widget: text
            hint: 'Links: `[Text](#ziel)` · Fett: `**Text**`'
          - label: Button-Text
            name: ctaLabel
            widget: string
            required: false
          - label: Button-Link
            name: ctaLink
            widget: string
            required: false
            hint: 'z. B. #kontakt oder /nis2-check/'
          - label: Schritte
            name: steps
            widget: list
            label_singular: Schritt
            summary: '{{fields.title}}'
            fields:
            - label: Titel
              name: title
              widget: string
            - label: Text
              name: text
              widget: text
              hint: 'Links: `[Text](#ziel)` · Fett: `**Text**`'
            - label: Bild
              name: image
              widget: image
            - label: Bildbeschreibung (Alt-Text)
              name: imageAlt
              widget: string
        - label: Video mit drei Karten
          name: warum
          widget: object
          description: Headline über Video-Hintergrund, darunter Karten mit Icon. Ideal für genau drei Karten.
          summary: '{{fields.heading}}'
          fields:
          - label: So sieht der Block aus
            name: ansicht
            widget: image
            default: /uploads/bloecke/start-warum.jpg
            readonly: true
            required: false
            choose_url: false
          - label: Hintergrund
            name: theme
            widget: select
            default: dunkel
            options:
            - label: Dunkel
              value: dunkel
            - label: Hell
              value: hell
            hint: Beim Scrollen blendet die Seite in diese Farbe über.
          - label: Überschrift
            name: heading
            widget: string
          - label: Karten
            name: cards
            widget: list
            label_singular: Karte
            summary: '{{fields.label}}'
            fields:
            - label: Titel
              name: label
              widget: string
            - label: Text
              name: text
              widget: text
              hint: 'Links: `[Text](#ziel)` · Fett: `**Text**`'
            - label: Link
              name: link
              widget: string
              required: false
              default: '#kontakt'
        - label: Leistungen
          name: services
          widget: object
          description: Liste der Leistungen mit Video, Kennzahlen und Pfeil-Link.
          summary: '{{fields.line1}} {{fields.line2}}'
          fields:
          - label: So sieht der Block aus
            name: ansicht
            widget: image
            default: /uploads/bloecke/start-services.jpg
            readonly: true
            required: false
            choose_url: false
          - label: Hintergrund
            name: theme
            widget: select
            default: dunkel
            options:
            - label: Dunkel
              value: dunkel
            - label: Hell
              value: hell
            hint: Beim Scrollen blendet die Seite in diese Farbe über.
          - label: Überschrift – Zeile 1
            name: line1
            widget: string
          - label: Überschrift – Zeile 2
            name: line2
            widget: string
          - label: Einleitung
            name: intro
            widget: text
            hint: 'Links: `[Text](#ziel)` · Fett: `**Text**`'
          - label: Leistungen
            name: items
            widget: list
            label_singular: Leistung
            summary: '{{fields.title}}'
            fields:
            - label: Titel
              name: title
              widget: string
            - label: Text
              name: text
              widget: text
              hint: 'Links: `[Text](#ziel)` · Fett: `**Text**`'
            - label: Angabe 1 – Bezeichnung
              name: label1
              widget: string
              default: Einstieg
            - label: Angabe 1 – Wert
              name: value1
              widget: string
            - label: Angabe 2 – Bezeichnung
              name: label2
              widget: string
              default: Dauer
            - label: Angabe 2 – Wert
              name: value2
              widget: string
            - label: Video
              name: video
              widget: file
              required: false
            - label: Standbild zum Video
              name: poster
              widget: image
              required: false
            - label: Link
              name: link
              widget: string
              required: false
              default: '#kontakt'
            - label: Sprungmarke (optional)
              name: anchor
              widget: string
              required: false
              hint: 'z. B. nis2 – dann führt #nis2 zu dieser Leistung'
        - label: Globus
          name: globus
          widget: object
          description: Rotierender Pixel-Globus mit Text und Branchen-Liste. Nur einmal pro Seite verwenden.
          summary: '{{fields.line1}} {{fields.line2}}'
          fields:
          - label: So sieht der Block aus
            name: ansicht
            widget: image
            default: /uploads/bloecke/start-globus.jpg
            readonly: true
            required: false
            choose_url: false
          - label: Hintergrund
            name: theme
            widget: select
            default: dunkel
            options:
            - label: Dunkel
              value: dunkel
            - label: Hell
              value: hell
            hint: Beim Scrollen blendet die Seite in diese Farbe über.
          - label: Unsichtbare Überschrift (für Screenreader)
            name: srHeading
            widget: string
          - label: Überschrift – Zeile 1
            name: line1
            widget: string
          - label: Überschrift – Zeile 2
            name: line2
            widget: string
          - label: Unterzeile
            name: sub
            widget: string
          - label: Text
            name: text
            widget: text
            hint: 'Links: `[Text](#ziel)` · Fett: `**Text**`'
          - label: Branchen
            name: branches
            widget: list
            label_singular: Branche
            summary: '{{fields.title}}'
            fields:
            - label: Titel
              name: title
              widget: string
            - label: Untertitel
              name: subtitle
              widget: string
            - label: Text
              name: text
              widget: text
              hint: 'Links: `[Text](#ziel)` · Fett: `**Text**`'
        - label: News & Insights
          name: insights
          widget: object
          description: Die neuesten Blogbeiträge mit Filter und Suche.
          summary: '{{fields.heading}}'
          fields:
          - label: So sieht der Block aus
            name: ansicht
            widget: image
            default: /uploads/bloecke/start-insights.jpg
            readonly: true
            required: false
            choose_url: false
          - label: Hintergrund
            name: theme
            widget: select
