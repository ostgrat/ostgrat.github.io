
<style>
/* VOICE: ruhig, präzise, erwachsen – Konzern-Niveau ohne Konzern-Lärm
   IDEA: ein dunkler Kontrollraum voller Zeichen; die Taschenlampe zeigt, was im Dunkeln liegt
   PICTURE: das ASCII-Licht-Raster als durchgehende Bühne, Abschnitte liegen als Kästen darauf
   COLOUR and TYPE: Graphit, Schnee-Weiß, Lachs-Akzent nur im CTA; Noto Serif JP + Space Grotesk
   LAYOUT: gerahmte Fläche, Nav als Zellen rechts, Headline links; Folgeabschnitte als graue Kästen */
:root{color-scheme:dark;--red:var(--p-acc,#f0704f);--fh:"IBM Plex Serif";--fb:"Space Grotesk";
  --box:color-mix(in srgb,var(--p-dk,#0f0e12) 95%,transparent);--btn:color-mix(in srgb,var(--p-dk,#0f0e12) 87%,var(--p-inkd,#f1eee8));--acc:color-mix(in srgb,var(--p-acc,#f0704f) 70%,var(--p-lt,#ebe9e4));--acc-hi:var(--p-acc,#f0704f);--sw:1px;--frame:12px;--col:calc((100vw - 2 * var(--frame)) / 12);
  /* Schriftschnitte: Fließtext, Button (gleich groß wie Fließtext), Label */
  --fs-p:17px;--fw-p:400;--fs-btn:15px;--fw-btn:400;--fs-lab:12px;--fw-lab:400;--ls-lab:.12em;--ls-eb:.11em;--fw-eb:500}
/* Hell/Dunkel: --t (0 = dunkel, 1 = hell) setzt das Skript je Element, passend zur Übergangsfront im Raster */
:root,.th{--bg:color-mix(in srgb,var(--p-lt,#ebe9e4) calc(var(--tb,0) * 100%),var(--p-dk,#0f0e12));--ink:color-mix(in srgb,var(--p-inkl,#16151a) calc(var(--t,0) * 100%),var(--p-inkd,#f1eee8));
  --mut:color-mix(in srgb,var(--p-mutl,#4c4a52) calc(var(--t,0) * 100%),var(--p-mutd,#c2bfc6));--hi:color-mix(in srgb,#000 calc(var(--t,0) * 100%),#fff);
  --line:color-mix(in srgb,color-mix(in srgb,var(--p-inkl,#16151a) 16%,transparent) calc(var(--t,0) * 100%),color-mix(in srgb,var(--p-inkd,#f1eee8) 9%,transparent));
  --ln:color-mix(in srgb,color-mix(in srgb,var(--p-inkl,#16151a) 26%,transparent) calc(var(--t,0) * 100%),color-mix(in srgb,var(--p-inkd,#f1eee8) 16%,transparent));
  --grn:color-mix(in srgb,var(--p-army,#4b5320) calc(var(--t,0) * 100%),var(--p-army2,#a4b26c))}   /* Army Green: auf Hell das satte Oliv, auf Dunkel eine hellere Stufe */
.th{color:var(--ink)}
/* auf Hell: Fließtext eine Stufe kräftiger, damit das Verdicken unter dem Zeiger nicht zu stark wirkt */
.s2-pin p{font-weight:400}.s2-pin .lq{--lqs:1.05px}
.lab{font:var(--fw-lab) var(--fs-lab)/1.2 var(--fb),system-ui,sans-serif;letter-spacing:var(--ls-lab);text-transform:uppercase}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip}
html{scroll-behavior:smooth}
html{scrollbar-gutter:stable}   /* Popup sperrt das Scrollen ohne Layout-Sprung */
body{--lh:1.42;font:var(--fw-p) var(--fs-p)/var(--lh) var(--fb),system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
/* Markierung: harter Kontrast, kehrt sich auf hellen Flächen automatisch um (dort --bg/--ink tauschen) */
::selection{background:var(--ink);color:var(--bg)}
:focus-visible{outline:var(--sw) solid var(--acc);outline-offset:3px}

.frame{position:relative;display:flow-root;margin:var(--frame);border:var(--sw) solid var(--line);touch-action:manipulation}
/* Raster-Leinwand liegt in der Seite und scrollt nativ mit; sie ist höher als der Bildschirm und springt nur ab und zu nach */
#fx{position:fixed;left:0;top:0;display:block;width:100%;height:100%;z-index:0;pointer-events:none}
/* Fließtext: wird unter dem Zeiger flüssig etwas fetter – per Kontur, damit nie eine Zeile umbricht */
.lq i{font-style:normal;color:var(--lqc,var(--mut));-webkit-text-stroke:calc(.02px + var(--w,0) * var(--lqs,1.52px)) currentColor}
.cta b span.lq{--lqc:var(--ink);--lqs:.7px}
/* Buttons: Schrift wechselt beim Hover nie die Farbe, sie wird nur kräftiger */
.cta .lq i,.ct-send .lq i,.fab .lq i,.pp-x .lq i,.mm-foot .lq i{color:var(--lqc,currentColor)!important}
.cta b span,.ct-send b span,.fab .fab-p,.pp-x,.mm-foot span,.cta .lq i,.ct-send .lq i,.fab .lq i{transition:-webkit-text-stroke-width .2s}
.cta:hover b span,.cta:focus-visible b span,.ct-send:hover b span,.ct-send:focus-visible b span,.fab:hover .fab-p,.fab:focus-visible .fab-p,.pp-x:hover,.pp-x:focus-visible,.mm-foot:hover span{-webkit-text-stroke:.3px currentColor}
.cta:hover .lq i,.cta:focus-visible .lq i,.ct-send:hover .lq i,.ct-send:focus-visible .lq i,.fab:hover .lq i,.fab:focus-visible .lq i{-webkit-text-stroke:calc(.3px + var(--w,0) * var(--lqs,.7px)) currentColor}.lqa{--lqc:currentColor;--lqs:1.1px}nav a span.lq{--lqc:var(--ink);--lqs:.7px}   /* auf Buttons nur ein Hauch */
.sp i{font-style:normal;position:relative} /* Grundkontur immer an, damit der Browser die Glyphen nie zwischen zwei Render-Modi umschaltet (das war das Springen) */

header{position:sticky;top:0;z-index:3;display:flex;align-items:stretch;justify-content:space-between;height:56px;margin:calc(-1 * (var(--frame) + var(--sw))) calc(-1 * (var(--frame) + var(--sw))) 0;padding:0 calc(var(--frame) + var(--sw));background:var(--bg);border-bottom:var(--sw) solid var(--line)}   /* volle Breite, ganz oben, liegt über dem Rahmen */
.hfx{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.bb > .hfx{padding:0;border:0;background:none}
.brand{display:flex;align-items:center;padding:0 16px}
.brand svg{height:24px;width:auto;fill:currentColor;flex:none}
nav{display:flex}
nav a{position:relative;font-weight:var(--fw-btn);display:flex;align-items:center;padding:0 16px;border-left:var(--sw) solid var(--line);font-size:var(--fs-btn);letter-spacing:0}
@media(min-width:1180px){header{display:grid;grid-template-columns:repeat(12,minmax(0,1fr))}.brand{grid-column:1/4}nav{grid-column:6/13;display:flex;justify-content:flex-end}}
nav a::before{content:"";position:absolute;inset:0;background:var(--ink);opacity:0;transition:opacity .45s cubic-bezier(.4,0,.2,1);pointer-events:none}
nav a.on::before{opacity:1}   /* Zustandswechsel: volle Fläche in Schriftfarbe, Schrift kippt für Kontrast */
nav a.on span{color:var(--bg)}nav a.on span.lq{--lqc:var(--bg)}
nav a.fx span.lq i{transition:color .45s cubic-bezier(.4,0,.2,1),-webkit-text-stroke-width .2s}   /* Farbe blendet nur beim Hover-Wechsel, Themenwechsel sofort */
nav a.on span{-webkit-text-stroke:.3px currentColor}
.mm{position:fixed;left:0;right:0;top:0;z-index:41;background:var(--bg);color:var(--ink);border-bottom:var(--sw) solid var(--line);
  clip-path:inset(0 0 100% 0);pointer-events:none;transition:clip-path .38s cubic-bezier(.2,.7,.2,1)}   /* Mega-Menü: eigene, durchgehende Kachel unter der Navbar, randabfallend */
.mm.open{clip-path:inset(0);pointer-events:auto}
.mm::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--grain);background-size:var(--grain-s,256px);background-attachment:fixed;opacity:calc(.035 + .045 * var(--t,0));image-rendering:pixelated}   /* dieselbe Papier-Textur wie die Seite */
.mm-in{position:relative;z-index:1}
.mm-in{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(3,minmax(0,1.7fr)) minmax(0,3fr);gap:0 clamp(24px,2.6vw,48px);padding:clamp(36px,5vh,56px) calc(var(--frame) + var(--col)) clamp(40px,6vh,64px)}
.mm-in > *{opacity:0;translate:0 -8px;transition:opacity .3s,translate .45s cubic-bezier(.2,.7,.2,1)}
.mm.open .mm-in > *{opacity:1;translate:0 0}
.mm.open .mm-in > :nth-child(1){transition-delay:.1s}.mm.open .mm-in > :nth-child(2){transition-delay:.14s}.mm.open .mm-in > :nth-child(3){transition-delay:.18s}.mm.open .mm-in > :nth-child(4){transition-delay:.22s}.mm.open .mm-in > :nth-child(5){transition-delay:.26s}
.mm-k{margin:0 0 18px;color:var(--acc-hi)}   /* Spaltenköpfe als Labels in der Akzentfarbe */
.mm-c ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.mm-c a{color:inherit;text-decoration:none;font:var(--fw-p) 15px/1.3 var(--fb),system-ui,sans-serif;background:linear-gradient(currentColor,currentColor) 0 100%/0 var(--sw) no-repeat;transition:background-size .3s cubic-bezier(.2,.7,.2,1)}
.mm-c a:hover,.mm-c a:focus-visible{background-size:100% var(--sw);outline:0}
.mm-big ul{gap:10px}.mm-big a{font:400 clamp(24px,2vw,30px)/1.15 var(--fh),serif;letter-spacing:-.02em}
.mm-nl{display:flex;flex-direction:column;align-items:stretch}
.mm-t{margin:0 0 18px;max-width:36ch;color:var(--mut);font:var(--fw-p) 15px/1.45 var(--fb),system-ui,sans-serif}
.mm-f{display:flex;height:44px;border:var(--sw) solid var(--ln)}
.mm-f input{flex:1;min-width:0;padding:0 14px;border:0;background:none;color:inherit;font:var(--fw-p) 15px var(--fb),system-ui,sans-serif;outline:0}
.mm-f input::placeholder{color:var(--mut)}
.mm-f:focus-within{border-color:var(--ink)}
.mm-f button{flex:none;width:44px;display:grid;place-items:center;border:0;background:var(--acc-hi);color:#1b1416;cursor:pointer;transition:width .25s cubic-bezier(.3,1.2,.5,1)}
.mm-f button:hover,.mm-f button:focus-visible{width:50px}
.mm-f svg{width:18px;height:18px;fill:currentColor}
.mm-ok{margin-top:10px;color:var(--mut);font:13px/1.4 var(--fb),system-ui,sans-serif}
@media(max-width:900px),(hover:none){.mm{display:none}}

nav a span{position:relative;color:var(--ink);transition:-webkit-text-stroke-width .2s}
nav a.fx span{transition:color .45s cubic-bezier(.4,0,.2,1),-webkit-text-stroke-width .2s}   /* beim Hover kräftiger und auf voller Fläche in Grundfarbe */
nav a:hover span,nav a:focus-visible span{-webkit-text-stroke:.3px currentColor}
nav a:hover span.lq i,nav a:focus-visible span.lq i{-webkit-text-stroke:calc(.3px + var(--w,0) * var(--lqs,.7px)) currentColor}
.menu{display:none;width:56px;border:0;border-left:var(--sw) solid var(--line);background:none;color:inherit;cursor:pointer}
.menu svg{width:22px;height:22px;fill:currentColor}   /* Icons: Phosphor Regular */

.hero{position:relative;z-index:1;min-height:calc(100svh - 56px - var(--bb));display:flex;align-items:center;padding:clamp(48px,8vh,96px) clamp(24px,13.2vw,260px) clamp(64px,14vh,180px) var(--col);pointer-events:none}
.copy{max-width:600px}
.copy h1,.copy p{pointer-events:auto}
h1,h2{margin:0;font-weight:var(--fhw,400);font-family:var(--fh),Georgia,serif;text-wrap:balance}
h1{font-size:clamp(26px,min(4.6vw,calc((100vw - 48px) / 10.8)),64px);line-height:1.1;letter-spacing:-.012em}
h1 .ln{display:block;white-space:nowrap}
/* dauerhaft hinterlegt: harter Kontrast wie die Markierung */
h1 .hl{width:fit-content;margin:.14em 0 0 -.1em;padding:0 .1em;background:var(--ink);color:var(--bg)}
h1 .hl::selection{background:var(--bg);color:var(--ink)}
/* „Auf Konzern-Niveau.“ wird nach der Intro-Welle getippt: der weiße Kasten wächst mit, ein Textcursor blinkt */
h1 .hl{position:relative}
h1 .hl.typing{clip-path:inset(-2px var(--clip,100%) -2px -2px)}
.hl .caret{position:absolute;top:.17em;bottom:.13em;left:var(--cx,.1em);width:2px;background:var(--bg);pointer-events:none}
.hl .caret.blink{animation:caret 1.05s steps(1) infinite}
.hl .caret.gone{opacity:0;transition:opacity .5s}
@keyframes caret{50%{opacity:0}}
.lead{margin:28px 0 0;max-width:410px;color:var(--mut);font-size:var(--fs-p);line-height:var(--lh)}
.cta{pointer-events:auto;position:relative;display:inline-flex;align-items:stretch;height:44px;margin-top:44px;font-weight:var(--fw-btn);font-size:var(--fs-btn)}
/* Glaskasten und orange Box sind getrennte Elemente; die Box schwebt über dem Glas */
.cta b{display:flex;align-items:center;padding:0 16px;font-weight:var(--fw-btn);background:color-mix(in srgb,var(--p-inkd,#f1eee8) 4%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 var(--sw) color-mix(in srgb,color-mix(in srgb,var(--p-inkl,#16151a) 16%,transparent) calc(var(--t,0) * 100%),color-mix(in srgb,var(--p-inkd,#f1eee8) 5%,transparent));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);transition:background .3s,backdrop-filter .3s,-webkit-backdrop-filter .3s}
.cta > i:not(.lamp){display:flex;align-items:center;justify-content:flex-end;width:44px;padding-right:12px;background:var(--acc-hi);color:var(--p-dk,#0f0e12);transition:width .25s cubic-bezier(.3,1.2,.5,1)}
.cta > i svg{width:20px;height:20px;fill:currentColor}
/* Hover: nur die orange Box wird breiter; das Glas wird etwas frostiger */
.cta:hover b,.cta:focus-visible b{background:color-mix(in srgb,var(--p-inkd,#f1eee8) 9%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cta:hover > i,.cta:focus-visible > i{width:48px}

/* Abschnitt 2: eine Box zwischen zwei Linien. Am Desktop klebt sie fest, während der Fortschritt durch die Punkte läuft */
.s2{--up:0px;--pad:clamp(16px,4vw,64px);--top:55px;position:relative;z-index:1;margin-bottom:calc(-1 * var(--up))}
.s2-pin{position:sticky;top:calc(var(--top) + var(--up));height:calc(100svh - var(--top) - var(--frame) - var(--bb));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:var(--sw) solid var(--ln);border-bottom:var(--sw) solid var(--ln)}
.s2-text{display:flex;flex-direction:column;padding:clamp(56px,10vh,110px) clamp(32px,5vw,88px) clamp(56px,10vh,110px) var(--col);min-height:0}
.s2-text h2{margin-bottom:24px}
.s2-text > p{margin:0;max-width:460px;color:var(--mut)}
.s2-list{position:relative;margin:auto 0 clamp(24px,6vh,64px);padding:0 0 0 28px;list-style:none}   /* sitzt unten, aber mit Abstand zum Rand */
.s2-list::before,.s2-bar{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--sw);background:var(--line)}
.s2-bar{background:linear-gradient(to bottom,color-mix(in srgb,var(--grn) 15%,transparent),var(--grn));box-shadow:0 0 4px color-mix(in srgb,var(--ink) calc(12% - var(--t,0) * 10%),transparent);transform-origin:50% 0;transform:scaleY(0)}
/* leuchtende Spitze: wie eine kleine Platte, strahlt seitlich und nach hinten, kaum nach vorne */
.s2-tip{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;will-change:transform}
.s2-tip::before{content:none}
.s2-tip::after{content:"";position:absolute;left:0;top:0;width:var(--sw);height:22px;transform:translate(0,-100%);background:linear-gradient(to bottom,transparent,var(--hi));box-shadow:0 0 6px 1px color-mix(in srgb,var(--ink) calc(28% - var(--t,0) * 24%),transparent);border-radius:1px}   /* nur das vordere Ende der Linie glüht */
.s2-list li{padding:18px 0;opacity:.34;filter:blur(0);translate:10px 0;transition:opacity .6s,filter .6s,translate .8s cubic-bezier(.2,.7,.2,1);animation:fl 6s ease-in-out infinite}
.s2-list li:nth-of-type(2){animation-delay:-2s}.s2-list li:nth-of-type(3){animation-delay:-4s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}   /* ganz leichtes Schweben */
.s2-list li:first-of-type{padding-top:0}.s2-list li:last-child{padding-bottom:0}
.s2-list li.on{opacity:1;translate:0 0}   /* der aktive Punkt rückt an den Fortschrittsbalken heran */
.s2-list li.done{translate:4px 0}
.s2-list li.next{filter:blur(2.5px)}   /* noch nicht erreichte Punkte samt Text leicht unscharf */
.s2-list h3{display:flex;align-items:center;gap:12px;margin:0;font-size:20px;font-weight:500}
.s2-list h3 svg{flex:none;width:22px;height:22px;fill:currentColor}
.s2-list h3 .hl{padding:0 .3em;background:var(--ink);color:var(--bg)}   /* hinterlegt wie die Hero-Headline */
.s2-list p{margin:0;padding-top:8px;padding-left:34px;max-width:454px;color:var(--mut);font-size:var(--fs-p)}
.li-pic{display:none}
/* rechts: Bild nimmt die halbe Bildschirmbreite ein, von Linie zu Linie, und fährt rechts aus dem Rahmen */
.s2-media{position:relative;border-left:var(--sw) solid var(--ln)}
.s2-pic{position:absolute;inset:0;margin:0;overflow:hidden;background:color-mix(in srgb,var(--p-dk,#0f0e12) 82%,#000)}

.s2-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:inset(0 0 100% 0)}
.s2-pic img.prev{clip-path:inset(0);z-index:1}
.s2-pic img.on{clip-path:inset(0);z-index:2;transition:clip-path .8s cubic-bezier(.7,0,.2,1)}   /* Bildwechsel: von oben nach unten aufziehen */
/* Abschnitt 3: gleiche Box, Bilder hängen an einem Ring, den man von vorne nur als Linie sieht, und rotieren durch */
.s3{--up:0px;margin-bottom:0}
.red{color:var(--red);font-style:normal}
/* alle Headlines: Laufweite -2,5 % */
h1,.s2-text h2,.why-h,#gscroll .gcopy h2{letter-spacing:-.035em}
/* Abschnitt 2 baut sich beim Hereinkommen auf */
.s2-pin{border-top-color:transparent}
.s2-pin::before{content:"";position:absolute;left:0;right:0;top:calc(-1 * var(--sw));height:var(--sw);background:var(--ln);transform:scaleX(0);transform-origin:left;transition:transform 1.2s cubic-bezier(.6,0,.2,1);z-index:2}
.s2-media{border-left-color:transparent}
.s2-media::before{content:"";position:absolute;left:calc(-1 * var(--sw));top:0;bottom:0;width:var(--sw);background:var(--ln);transform:scaleY(0);transform-origin:top;transition:transform 1.1s .35s cubic-bezier(.6,0,.2,1);z-index:2}
.s2 .s2-text > h2,.s2 .s2-text > p,.s2 .s2-list{opacity:0;filter:blur(8px);translate:0 18px;transition:opacity .8s,filter .8s,translate 1s cubic-bezier(.2,.7,.2,1),line-height 1.1s cubic-bezier(.2,.7,.2,1)}
.s2 .s2-text > p{line-height:1.6}.s2.in .s2-text > p{line-height:var(--lh)}
.s2 .s2-text > p{transition-delay:.12s}.s2 .s2-list{transition-delay:.24s}
.s2.in .s2-pin::before,.s2.in .s2-media::before{transform:none}
.s2.in .s2-text > h2,.s2.in .s2-text > p,.s2.in .s2-list{opacity:1;filter:none;translate:0 0}
@media(max-width:900px){.s2-pin{border-top-color:var(--ln)}.s2-pin::before{display:none}}
/* Handy/Tablet: Bilder randabfallend bis zum Rahmen, darüber und darunter Linien; Kacheln mit Trennlinien */
@media(max-width:900px){
  .s2-pin{--mx:var(--pad)}
  .li-pic{position:relative;margin:0 calc(-1 * var(--mx)) 20px!important;padding:0;aspect-ratio:auto!important;background:none!important;border-top:var(--sw) solid var(--ln);border-bottom:var(--sw) solid var(--ln)}   /* Bild bis zum Rahmen (Tablet) bzw. Bildschirmrand (Handy) */
  .li-pic img{display:block;width:100%;aspect-ratio:4/3;height:auto!important;background:color-mix(in srgb,var(--p-dk,#0f0e12) 82%,#000)}
  #gscroll section{border-top:0}   /* sonst doppelte Linie an der Kante zur Progress-Section */
  .why-grid{gap:0!important}
  .why-card{padding:32px 0 36px!important}
  .why-card + .why-card::before{content:"";position:absolute;left:-24px;right:-24px;top:0;height:var(--sw);background:var(--line);transform:scaleX(0);transform-origin:left;transition:transform 1.2s cubic-bezier(.6,0,.2,1)}
  .why-card:nth-child(3)::before{transition-delay:.25s}
  .why-grid.built .why-card + .why-card::before{transform:none}   /* Trennlinien bis zum Rand, bauen sich auf, bewegen sich nicht */
  .why-grid > b.h{left:-24px;right:-24px}
  /* Navbar: Logo und Burger schließen mit den Linien (16 px) ab, Burger links und rechts gleich */
  header{padding:0}
  .menu{width:48px!important}
}
@media(max-width:600px){.s2-pin{--mx:20px}}
@media(prefers-reduced-motion:reduce){.s2 .s2-text > h2,.s2 .s2-text > p,.s2 .s2-list{opacity:1;filter:none;translate:none}.s2 .s2-pin::before,.s2 .s2-media::before{transform:none}}
.s2-text > p{margin-bottom:clamp(36px,6vh,64px)}
/* ---------- Hero: Live-Überwachung rechts, schwebt; Unterkante etwa auf Höhe des Absatzes (per JS) ---------- */
.mon{position:absolute;left:50%;right:calc(var(--col) * .5);top:0;height:300px;z-index:0;pointer-events:none}
